name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      MUJOCO_GL: ${{ matrix.os == 'ubuntu-latest' && 'osmesa' || '' }}
      PYOPENGL_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'osmesa' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: OSMesa (headless OpenGL)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev
      - run: pip install -e ".[dev]"
      - name: Unit tests (CakeAI port, scene, physics)
        run: pytest -q -m "not render"
      - name: Rendering tests (markers + 2 s camera-in-the-loop match)
        run: pytest -q -m render
        continue-on-error: ${{ matrix.os == 'macos-latest' }}
